<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crazy Spot · Menú</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --neon:#7CFC00;
    --neon-soft:#a4ff4f;
  }
  html,body{
    height:100%;
    overflow:hidden;            /* SIN SCROLL */
    background:#020803;
    font-family:'Barlow Condensed', sans-serif;
    color:#d9ffd0;
  }
  .font-script{ font-family:'Permanent Marker', cursive; }
  #bg{ position:fixed; inset:0; z-index:0; }

  /* parpadeo neón del título */
  @keyframes flicker{
    0%,100%{ opacity:1; text-shadow:0 0 .8vh var(--neon),0 0 2.4vh var(--neon),0 0 6vh #39ff14; }
    3%{ opacity:.6; text-shadow:0 0 .4vh var(--neon); }
    6%,52%{ opacity:1; }
    54%{ opacity:.7; text-shadow:0 0 .6vh var(--neon); }
    56%{ opacity:1; text-shadow:0 0 .8vh var(--neon),0 0 2.4vh var(--neon),0 0 6vh #39ff14; }
  }
  .neon-title{ animation:flicker 6s infinite; color:#eaffd9; }

  /* tarjetas */
  @keyframes pulseBorder{
    0%,100%{ box-shadow:0 0 .6vh rgba(124,252,0,.45), inset 0 0 1.2vh rgba(124,252,0,.08); }
    50%{ box-shadow:0 0 1.8vh rgba(124,252,0,.75), inset 0 0 1.8vh rgba(124,252,0,.14); }
  }
  .card{
    background:rgba(3,14,5,.62);
    backdrop-filter:blur(8px);
    border:1px solid rgba(124,252,0,.55);
    border-radius:1.4vh;
    padding:1.6vh 1.8vh;
    animation:pulseBorder 4.5s ease-in-out infinite;
    display:flex; flex-direction:column;
    min-height:0; overflow:hidden;
    opacity:0; transform:translateY(3vh);
    animation:pulseBorder 4.5s ease-in-out infinite, enter .9s ease forwards;
  }
  @keyframes enter{ to{ opacity:1; transform:translateY(0);} }

  .card h2{
    font-size:2.4vh; font-weight:700; letter-spacing:.25em;
    text-transform:uppercase; color:#bef264;
    display:flex; align-items:center; gap:1vh;
    margin-bottom:1vh;
    border-bottom:1px solid rgba(124,252,0,.3);
    padding-bottom:.7vh;
    flex:none;
  }
  .card h2 .ico{ font-size:2.2vh; }

  .items{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:space-evenly; }

  .row{ display:flex; align-items:baseline; gap:.8vh; font-size:1.95vh; line-height:1.25; }
  .dots{ flex:1; border-bottom:.25vh dotted rgba(124,252,0,.35); transform:translateY(-.4vh); }
  .price{ font-weight:600; color:#bef264; white-space:nowrap; }

  .subcat{
    color:var(--neon-soft);
    letter-spacing:.18em; font-weight:700;
    font-size:1.5vh; text-transform:uppercase;
    text-shadow:0 0 .8vh rgba(124,252,0,.5);
    margin-top:.3vh;
  }

  @media (prefers-reduced-motion: reduce){
    .neon-title{ animation:none; }
    .card{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>

<body>
<canvas id="bg"></canvas>

<!-- TODO EL MENÚ EN UNA PANTALLA -->
<main class="relative z-10 h-full flex flex-col px-[2.5vw] py-[2vh] gap-[1.6vh]">

  <!-- CABECERA -->
  <header class="text-center flex-none">
    <h1 class="font-script neon-title leading-none" style="font-size:7.5vh">Crazy Spot</h1>
    <p class="font-script text-lime-400 leading-none" style="font-size:3.2vh; text-shadow:0 0 1.4vh rgba(124,252,0,.8)">MENU</p>
  </header>

  <!-- GRID: 3 columnas. Hash ocupa las dos filas del centro -->
  <section class="flex-1 min-h-0 grid gap-[1.4vh]"
           style="grid-template-columns:1fr 1.1fr 1fr; grid-template-rows:1.15fr .8fr .8fr;">

    <!-- WEED (columna 1, ocupa 2 filas) -->
    <div class="card" style="grid-row:1 / span 2; animation-delay:0s,.05s">
      <h2><span class="ico">🌿</span> Weed</h2>
      <div class="items" id="weed"></div>
    </div>

    <!-- HASH (columna 2, ocupa las 3 filas) -->
    <div class="card" style="grid-row:1 / span 3; animation-delay:0s,.15s">
      <h2><span class="ico">#</span> Hash</h2>
      <div class="items" id="hash"></div>
    </div>

    <!-- WPFF -->
    <div class="card" style="animation-delay:0s,.25s">
      <h2><span class="ico">❄️</span> WPFF</h2>
      <div class="items" id="wpff"></div>
    </div>

    <!-- ROSIN -->
    <div class="card" style="animation-delay:0s,.35s">
      <h2><span class="ico">🍯</span> Rosin</h2>
      <div class="items" id="rosin"></div>
    </div>

    <!-- EDIBLES -->
    <div class="card" style="animation-delay:0s,.45s">
      <h2><span class="ico">🍬</span> Edibles</h2>
      <div class="items" id="edibles"></div>
    </div>

    <!-- DRINKS -->
    <div class="card" style="animation-delay:0s,.55s">
      <h2><span class="ico">🥤</span> Drinks</h2>
      <div class="items" id="drinks"></div>
    </div>

  </section>

  <footer class="flex-none text-center text-lime-200/50 uppercase tracking-[.4em]" style="font-size:1.4vh">
    Asociación privada · Solo socios mayores de edad
  </footer>
</main>

<script>
/* ============ DATOS DEL MENÚ (edita aquí) ============ */
const MENU = {
  weed: [
    ["Purple Roses","12,50 €"],["Red Haze","13,50 €"],["Cosmopolis","15,00 €"],
    ["Soda Pop","16,00 €"],["Crypto Chronic","18,00 €"],["Pink Guava","18,00 €"],
    ["Sushi","18,00 €"],["Gas Guzzler","18,00 €"],["Mind Melts","18,00 €"],
    ["Zangria","19,00 €"],["Garlic Breath","19,00 €"],["Azulcar #4","18,00 €"]
  ],
  hash: [
    ["Gmo Static","18,00 €"],["FF Static","20,00 €"],
    {sub:"Staticroom"},
    ["Glitter Bomb","60,00 €"],["Megan Fox","60,00 €"],["Pollen Frozen Sift Lemon Cherry","40,00 €"],
    {sub:"Salias Terps"},
    ["Tropical Juice","60,00 €"],["Banana Rontz","60,00 €"],
    {sub:"Most Wanted"},
    ["La Kush Cake Cali Dry","30,00 €"],["Permanent Marker","40,00 €"],["Gelato 33","50,00 €"],
    {sub:"One Stop CA"},
    ["Gusher Mintz","40,00 €"],["Amaretto Mintz","40,00 €"]
  ],
  wpff:   [["Power Puff Farm","100,00 €"]],
  rosin:  [["Rosin","150,00 €"]],
  edibles:[["Gummies","25,00 €"],["Dirty Sprite","30,00 €"]],
  drinks: [["Agua","1,50 €"],["Cola","2,30 €"],["Té frío","2,50 €"],["Redbull","3,00 €"]]
};

function render(id, items){
  document.getElementById(id).innerHTML = items.map(it => {
    if (it.sub) return `<p class="subcat">${it.sub}</p>`;
    return `<div class="row">
      <span class="name">${it[0]}</span>
      <span class="dots"></span>
      <span class="price">${it[1]}</span>
    </div>`;
  }).join("");
}
Object.entries(MENU).forEach(([k,v]) => render(k,v));

/* ============ ESCENA THREE.JS ============ */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("bg");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020803);
scene.fog = new THREE.FogExp2(0x041006, 0.018);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 500);
camera.position.set(0, 6, 26);

/* --- Luna verde --- */
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(7, 48, 48),
  new THREE.MeshBasicMaterial({ color:0xcaffb0 })
);
moon.position.set(0, 12, -90);
scene.add(moon);

function glowTexture(){
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(128,128,10,128,128,128);
  grd.addColorStop(0,"rgba(160,255,110,0.9)");
  grd.addColorStop(0.4,"rgba(110,230,60,0.35)");
  grd.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture(), transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending
}));
halo.scale.set(60,60,1);
halo.position.copy(moon.position);
scene.add(halo);

/* --- Océano wireframe animado --- */
const oceanGeo = new THREE.PlaneGeometry(260, 160, 90, 60);
oceanGeo.rotateX(-Math.PI/2);
const ocean = new THREE.Mesh(
  oceanGeo,
  new THREE.MeshBasicMaterial({ color:0x39ff14, wireframe:true, transparent:true, opacity:.28 })
);
ocean.position.set(0, -2, -50);
scene.add(ocean);

const oceanBase = new THREE.Mesh(
  new THREE.PlaneGeometry(260,160),
  new THREE.MeshBasicMaterial({ color:0x02140a })
);
oceanBase.rotation.x = -Math.PI/2;
oceanBase.position.set(0, -2.4, -50);
scene.add(oceanBase);

const basePos = oceanGeo.attributes.position.array.slice();

/* --- Luciérnagas --- */
const N = 350;
const pGeo = new THREE.BufferGeometry();
const pos = new Float32Array(N*3), speed = new Float32Array(N);
for(let i=0;i<N;i++){
  pos[i*3]   = (Math.random()-.5)*160;
  pos[i*3+1] = Math.random()*40 - 2;
  pos[i*3+2] = -Math.random()*120;
  speed[i] = .01 + Math.random()*.04;
}
pGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color:0xa4ff4f, size:.45, transparent:true, opacity:.85,
  blending:THREE.AdditiveBlending, depthWrite:false
}));
scene.add(particles);

/* --- Animación (deriva suave de cámara, sin ratón: es para TV) --- */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if(!reduceMotion){
    const p = oceanGeo.attributes.position;
    for(let i=0;i<p.count;i++){
      const x = basePos[i*3], z = basePos[i*3+2];
      p.array[i*3+1] = Math.sin(x*.18 + t*1.1)*0.7 + Math.cos(z*.22 + t*.8)*0.55;
    }
    p.needsUpdate = true;

    const pp = pGeo.attributes.position;
    for(let i=0;i<N;i++){
      pp.array[i*3+1] += speed[i];
      if(pp.array[i*3+1] > 42) pp.array[i*3+1] = -2;
    }
    pp.needsUpdate = true;

    const s = 60 + Math.sin(t*1.4)*4;
    halo.scale.set(s,s,1);

    /* vaivén lento de cámara para que el fondo se sienta vivo en el TV */
    camera.position.x = Math.sin(t*.12)*2.5;
    camera.position.y = 6 + Math.sin(t*.2)*.6;
    camera.lookAt(0, 6, -60);
  }
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
